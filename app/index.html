<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faham has moved</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f9f9f7;color:#0b0b0b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:24px;line-height:1.6}
  .card{max-width:34ch;text-align:center}
  h1{font-size:19px;font-weight:650;margin:0 0 10px}
  p{font-size:15px;color:#52514e;margin:0 0 18px}
  a{display:inline-block;background:#17573A;color:#fff;text-decoration:none;
    padding:13px 20px;border-radius:999px;font-weight:620;font-size:15px;min-height:44px;
    box-sizing:border-box}
  @media (prefers-color-scheme:dark){
    body{background:#0d0d0d;color:#fff} p{color:#c3c2b7} a{background:#26794F}
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Faham has moved</h1>
    <p lang="en">This address is no longer used. Taking you to the app…</p>
    <p lang="id">Alamat ini tidak dipakai lagi. Mengarahkan ke aplikasi…</p>
    <p lang="ko">이 주소는 더 이상 사용되지 않습니다. 앱으로 이동합니다…</p>
    <a href="../">Open Faham</a>
  </div>

<script>
/* Clean up everything the old copy left in this browser, THEN redirect. The
   order matters: redirecting first would leave the old service worker and its
   caches registered against this path indefinitely. */
(function () {
  var done = false;
  function go() {
    if (done) return;
    done = true;
    window.location.replace('../');
  }

  var jobs = [];

  if ('serviceWorker' in navigator) {
    jobs.push(
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        })
        .catch(function () { /* nothing to undo */ })
    );
  }

  if (typeof caches !== 'undefined' && caches.keys) {
    jobs.push(
      caches.keys()
        .then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        })
        .catch(function () { /* nothing to undo */ })
    );
  }

  /* Settings and prayer log written by the old copy live on the same origin as
     the new one, so they are deliberately NOT cleared — a user who logged
     prayers at the old address keeps them at the new one. */

  Promise.all(jobs).then(go);
  window.setTimeout(go, 2500);   /* never leave anyone staring at this page */
})();
</script>
</body>
</html>
